<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CostaBugOff - Registrarse</title>
    <link rel="stylesheet" href="/static/css/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar__brand">
        <img class="logo-bug" src="/static/img/Jeremy.png" alt="CostaBugOff" />
        <span class="topbar__logo">CostaBugOff</span>
        <span class="topbar__view-tag">Registrarse</span>
      </div>
    </header>

    <main class="app" style="display:flex; justify-content:center;">
      <section style="max-width:420px; width:100%; margin-top:40px;">
        <div class="panel__header">
          <h1>Crear cuenta</h1>
        </div>

        {% if error %}
        <p style="color:var(--brick); font-size:13.5px;">{{ error }}</p>
        {% endif %}

        <form class="entity-form" method="POST" action="/registro">
          <div class="field">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Nombre" required autofocus />
          </div>
          <div class="field">
            <label for="apellido_paterno">Primer apellido</label>
            <input type="text" id="apellido_paterno" name="apellido_paterno" placeholder="Primer apellido" required />
          </div>
          <div class="field">
            <label for="apellido_materno">Segundo apellido</label>
            <input type="text" id="apellido_materno" name="apellido_materno" placeholder="Segundo apellido" required />
          </div>
          <div class="field">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="correo@ejemplo.com" required />
          </div>
          <div class="field">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Contraseña" required />
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--primary">Crear cuenta</button>
          </div>
        </form>
        <div style="margin-top:16px; font-size:13.5px;">
          <a href="/login">Ya tengo cuenta, ingresar</a>
        </div>
      </section>
    </main>
  </body>
</html>
